# Unit tests on every push and pull request.
# Offline: the tests fake every network call, so no secret is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen

      # Coverage: share of our code executed by the tests, per file. The job
      # fails under 85 %, so a feature merged without tests is caught.
      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=term --cov-report=html --cov-fail-under=85

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
