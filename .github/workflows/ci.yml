# Unit tests on every push and pull request.
# Offline: the tests fake every network call, so no secret is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true          # reuse downloaded packages between runs

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
