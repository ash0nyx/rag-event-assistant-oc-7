[project]
name = "7-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-mistralai>=1.1.6",
    "mistralai>=2.9.4",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Make the project root importable so tests can do `from scripts import fetch_events`
pythonpath = ["."]
testpaths = ["tests"]
