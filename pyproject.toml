[project]
name = "puls-events-rag"
version = "0.1.0"
description = "RAG assistant recommending cultural events in Paris (Open Agenda, LangChain, Mistral, FAISS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.17",
    "langchain-community<0.4",
    "langchain-core>=1.6.5",
    "langchain-mistralai>=1.1.6",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.17.0",
    "mistralai>=2.9.4",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

# Install the project itself into the venv so `rag` and `scripts` are importable
# from anywhere (scripts, API, tests) without PYTHONPATH tricks.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag", "scripts", "api"]

[tool.pytest.ini_options]
# Make the project root importable so tests can do `from scripts import fetch_events`
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Measure our code only, not the libraries.
source = ["api", "rag", "scripts", "ui"]
# Command-line tools that only run against the real Mistral / Open Agenda APIs.
# They are integration tools, not unit-testable offline (api_test.py is itself
# a functional test); their logic lives in rag/ and scripts/, which is measured.
omit = [
    "scripts/api_test.py",
    "scripts/ask_question.py",
    "scripts/evaluate_intent.py",
    "scripts/evaluate_rag.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# The `if __name__ == "__main__":` line of each script only calls main().
exclude_also = ['if __name__ == "__main__":']
